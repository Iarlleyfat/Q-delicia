*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:75px;
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    z-index:999;
    border-bottom:1px solid #222;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#e50914;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:#e50914;
}

.header-buttons{
    display:flex;
    gap:10px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:13px 22px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn-red{
    background:#e50914;
    color:#fff;
}

.btn-red:hover{
    background:#ff202b;
    transform:translateY(-3px);
}

.btn-white{
    background:#fff;
    color:#000;
}

.btn-white:hover{
    background:#ddd;
    transform:translateY(-3px);
}

.menu-toggle{
    display:none;
    background:none;
    border:none;
    color:white;
    font-size:30px;
}
