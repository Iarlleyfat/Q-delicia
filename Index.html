<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Pizzaria Q-Delícia — pizzas, hambúrgueres, esfihas e lanches caprichados.">

    <title>Pizzaria Q-Delícia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --preto: #050505;
            --preto2: #111111;
            --vermelho: #e50914;
            --vermelho-hover: #ff1a25;
            --branco: #ffffff;
            --cinza: #bdbdbd;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--preto);
            color: var(--branco);
            line-height: 1.6;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;

            background: rgba(0, 0, 0, 0.96);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            z-index: 1000;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 1.35rem;
            font-weight: 900;
            white-space: nowrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--vermelho);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 46px;
            padding: 0 22px;

            border-radius: 30px;
            border: none;

            text-decoration: none;

            font-size: 0.9rem;
            font-weight: 800;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .btn-red {
            background: var(--vermelho);
            color: white;
        }

        .btn-red:hover {
            background: var(--vermelho-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.35);
        }

        .btn-white {
            background: white;
            color: black;
        }

        .btn-white:hover {
            background: #e5e5e5;
            transform: translateY(-3px);
        }

        /* MENU MOBILE */

        .menu-toggle {
            display: none;

            background: transparent;
            border: none;

            color: white;

            font-size: 30px;

            cursor: pointer;
        }


        /* =========================
           BANNER
        ========================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding: 120px 6% 80px;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.80)
                ),
                url("banner.jpg") center center / cover no-repeat;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 6rem);
            line-height: 1;
            font-weight: 900;

            margin-bottom: 25px;
        }

        .hero h1 span {
            display: block;
            color: var(--vermelho);
        }

        .hero p {
            max-width: 800px;

            color: #eeeeee;

            font-size: clamp(1rem, 2vw, 1.25rem);

            font-weight: 700;

            margin-bottom: 35px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }


        /* =========================
           SEÇÕES
        ========================= */

        section {
            padding: 100px 6%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 900;

            margin-bottom: 10px;
        }

        .section-title h2 span {
            color: var(--vermelho);
        }

        .section-title p {
            color: var(--cinza);
        }


        /* =========================
           CARDÁPIO
        ========================= */

        #cardapio {
            background: #0b0b0b;
        }

        .menu-grid {
            max-width: 1200px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 28px;
        }

        .food-card {
            background: #151515;

            border-radius: 18px;

            padding: 35px 25px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);

            border: 1px solid rgba(255, 255, 255, 0.06);

            transition: 0.35s ease;
        }
